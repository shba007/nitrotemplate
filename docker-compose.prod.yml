services:
  app:
    image: ghcr.io/shba007/nitrotemplate:latest@sha256:66f225a0848b744c21438d6cb57044068bbc8e69b0ed412e5ac730f8cd32c88d
    env_file:
      - .env
    volumes:
      - nitrotemplate_data:/app/data
    expose:
      - 3000
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  nitrotemplate_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/nitrotemplate/data

networks:
  internal:
    driver: overlay