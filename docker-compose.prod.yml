services:
  app:
    image: ghcr.io/shba007/nitrotemplate:latest@sha256:7ac61d201749c5969074d9a3e111e1d461f2cd6969972a8de6ee1ed2c6f99853
    env_file:
      - .env
    volumes:
      - nitrotemplate_data:/app/data
    expose:
      - 3000
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  nitrotemplate_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/nitrotemplate/data

networks:
  internal:
    driver: overlay
